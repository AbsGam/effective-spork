<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form action="/users" method="post">
    <div>
        <label>
            Имя
            <input type="text" name="name" value="{{ name.name }}">
        </label>
        {% if errors['name'] %}
        <div>{{ errors['name'] }}</div>
        {% endif %}
    </div>
    <input type="submit" value="Сохранить">
</form>
</body>
</html>
